name: Build test APK

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Convex backend to dev deployment
        run: bunx convex dev --once --tail-logs disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (EAS)
        run: eas build --platform android --profile preview --non-interactive --json > eas-build.json

      - name: Download APK
        run: |
          BUILD_ID=$(node -e "const b=JSON.parse(require('fs').readFileSync('eas-build.json','utf8'));const id=Array.isArray(b)?b[0].id:b.id;console.log(id)")
          eas build:download "$BUILD_ID" --platform android --output apk/moiney.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          files: apk/moiney.apk
          prerelease: true
