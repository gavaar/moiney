name: Build test APK

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tests and types
        run: bun run verify

      - name: Deploy Convex backend to dev deployment
        run: bunx convex dev --once --tail-logs disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (EAS)
        run: eas build --platform android --profile preview --non-interactive --json > eas-build.json

      - name: Download APK
        run: |
          BUILD_ID=$(node -e "const b=JSON.parse(require('fs').readFileSync('eas-build.json','utf8'));const id=Array.isArray(b)?b[0].id:b.id;console.log(id)")
          APK_PATH=$(eas build:download --build-id "$BUILD_ID" --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).path))")
          mkdir -p apk
          mv "$APK_PATH" apk/moiney.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          files: apk/moiney.apk
          prerelease: true
