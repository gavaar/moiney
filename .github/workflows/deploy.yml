name: Deploy web and build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tests and types
        run: bun run verify

      - name: Read app version and check release immutability
        id: app-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          PUBLISHED=$(bun run scripts/check-app-release-cli.ts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Build website for Cloudflare Pages
        run: bun run build:web
        env:
          EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}

      - name: Deploy Convex backend to production
        if: steps.app-version.outputs.published != 'true'
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}

      - name: Check current main before web deployment
        id: web-release
        shell: bash
        run: |
          CURRENT_MAIN=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping obsolete web deployment; production must not be rolled back."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy website to Cloudflare Pages
        if: steps.web-release.outputs.publish == 'true'
        # bunx installs the deployment tool in its cache, not in the APK's dependencies.
        run: bunx wrangler@4.157.0 pages deploy dist --project-name=moiney --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: expo/expo-github-action@v8
        if: steps.app-version.outputs.published != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (EAS)
        if: steps.app-version.outputs.published != 'true'
        run: eas build --platform android --profile preview --non-interactive --json > eas-build.json

      - name: Download APK
        if: steps.app-version.outputs.published != 'true'
        run: |
          BUILD_ID=$(node -e "const b=JSON.parse(require('fs').readFileSync('eas-build.json','utf8'));const id=Array.isArray(b)?b[0].id:b.id;console.log(id)")
          APK_PATH=$(eas build:download --build-id "$BUILD_ID" --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).path))")
          mkdir -p apk
          mv "$APK_PATH" apk/moiney.apk

      - name: Create GitHub Release
        if: steps.app-version.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app-version.outputs.version }}
          name: ${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: apk/moiney.apk
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish app release metadata
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          DOWNLOAD_URL="https://github.com/gavaar/moiney/releases/download/$APP_VERSION/moiney.apk"
          curl --fail --location --head --retry 3 "$DOWNLOAD_URL"
          ARGS=$(node -e 'console.log(JSON.stringify({latestAppVersion: process.env.APP_VERSION, downloadUrl: `https://github.com/gavaar/moiney/releases/download/${process.env.APP_VERSION}/moiney.apk`}))')
          bunx convex run appRelease:publish "$ARGS" --prod
