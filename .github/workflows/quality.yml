name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tests and types
        run: bun run verify

      - name: Check Cloudflare web export
        run: bun run build:web
        env:
          # Export checks need no production access or credentials, including on fork PRs.
          EXPO_PUBLIC_CONVEX_URL: https://example.convex.cloud
